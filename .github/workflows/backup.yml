name: Backup D1

# Every day the production database is exported to backups/<db>-<timestamp>.sql.gz
# and committed to this repository. No server to maintain, no local command.
#
# Retention: the newest `BACKUP_KEEP` snapshots (repository variable, default
# 30) are kept; older ones are pruned in the same commit.
#
# Requires the same single secret as Deploy: CLOUDFLARE_API_TOKEN, with
# D1:Edit. The account is taken from app/wrangler.jsonc. The dumps are plain
# SQL, so they can be read, diffed, or re-imported with the "Restore D1"
# workflow.

on:
  schedule:
    # 03:17 UTC — off the hour, when Cloudflare's API is quiet.
    - cron: '17 3 * * *'
  # Changing the backup machinery proves it still works: a push that touches
  # these files produces a snapshot straight away instead of waiting for 03:17
  # to find out that it broke.
  push:
    branches: [main]
    paths:
      - 'app/scripts/backup.mjs'
      - 'app/scripts/restore.mjs'
      - '.github/workflows/backup.yml'
      - '.github/actions/clean-credentials/action.yml'
  workflow_dispatch:
    inputs:
      keep:
        description: How many snapshots to keep
        type: string
        required: false
        default: '30'

concurrency:
  group: d1-backup
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      BACKUP_KEEP: ${{ inputs.keep || vars.BACKUP_KEEP || '30' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The default token cannot trigger a second workflow, so committing a
          # backup will never restart a deploy.
          persist-credentials: true

      - uses: ./.github/actions/clean-credentials

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Check credentials
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::error::CLOUDFLARE_API_TOKEN is not set — Settings → Secrets and variables → Actions → New repository secret."
          exit 1

      - name: Export the database
        run: npm run db:backup -- --keep="$BACKUP_KEEP"

      - name: Commit the snapshot
        working-directory: .
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backups
          if git diff --cached --quiet; then
            echo "Nothing to back up (empty database or identical dump)."
            exit 0
          fi
          git commit -m "chore(backup): D1 snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - name: Summary
        if: always()
        working-directory: .
        run: |
          {
            echo "### D1 backup"
            echo
            echo "Snapshots in the repository:"
            echo '```'
            ls -lh backups/*.sql.gz 2>/dev/null | awk '{print $5, $9}' || echo 'none yet'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
