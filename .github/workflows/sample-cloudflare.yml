name: Publish the accessories sample (Cloudflare Worker)

# A permanent public link for the accessories sample, served from Cloudflare's
# edge as a static Worker — no database, no logic, no cost beyond the free plan:
#
#   https://noor-accessoires.<account>.workers.dev
#
# It needs only CLOUDFLARE_API_TOKEN with Workers Scripts:Edit — the same
# permission the shop's own deploy already uses, so nothing has to be granted
# again. (GitHub Pages would work too, but its environment only allows `main`.)
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - arena/bb8a518e-store-pinokio
    paths:
      - 'samples/accessoires/**'
      - '.github/workflows/sample-cloudflare.yml'

permissions:
  contents: read

concurrency:
  group: sample-cloudflare
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Committed on purpose (an identifier, not a secret) — the same account
      # that app/wrangler.jsonc deploys the shop to.
      CLOUDFLARE_ACCOUNT_ID: c49a339ecc1caadccb50c672cdbd88da
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: samples/accessoires/app/package-lock.json

      - name: Install
        working-directory: samples/accessoires/app
        run: npm ci || npm install

      - name: Build the static sample
        working-directory: samples/accessoires/app
        env:
          # Static sample: bundled catalogue, checkout confirmed in the browser,
          # no dashboard. Served from the root of its own host, so no SITE_BASE.
          VITE_DEMO: '1'
        run: npx vite build

      - name: Check credentials
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set — Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Deploy
        id: deploy
        working-directory: samples/accessoires/app
        run: |
          set +e
          npx wrangler deploy --config wrangler.sample.jsonc 2>&1 | tee /tmp/deploy.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            # Annotations survive in the Actions UI and through the API, unlike
            # the raw log. A missing permission reads as "Authentication error".
            tail -n 20 /tmp/deploy.log | sed 's/^/::error::wrangler: /'
            exit "$code"
          fi
          url=$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/deploy.log | tail -n 1 || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "::notice::Sample published: ${url:-see the deploy log}"

      - name: Say the link
        if: steps.deploy.outputs.url != ''
        run: |
          {
            echo "### The accessories sample is live"
            echo
            echo "[${{ steps.deploy.outputs.url }}](${{ steps.deploy.outputs.url }})"
            echo
            echo "Send that link to a client. Prices in LYD, Arabic first (RTL),"
            echo "French and English one click away — a static build, nothing to pay for."
          } >> "$GITHUB_STEP_SUMMARY"
