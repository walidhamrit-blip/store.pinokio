name: Deploy

# Push to main → typecheck, tests, build, deploy. Nothing to click, nothing to
# run locally.
#
# Required (one-time, in the repository settings) — one single secret:
#   Secrets   CLOUDFLARE_API_TOKEN   token with Workers Scripts:Edit + D1:Edit
#
# Optional, auto-detected when absent:
#   (the account id is committed in app/wrangler.jsonc, it is not a secret)
#             ADMIN_PASSWORD         only needed to *change* the dashboard
#                                    password; the one already on the Worker
#                                    is kept by every deploy
#   Variables STORE_URL              health-check target; otherwise the URL is
#                                    read from the deploy output
#             BACKUP_KEEP            snapshots to keep (default 30)
#
# This is the only deploy pipeline: Cloudflare's own Git build must stay
# disconnected (Workers & Pages → store → Settings → Builds), otherwise two
# pipelines deploy the same Worker and race each other.

on:
  push:
    branches: [main]
    # Backups and docs must not restart the shop.
    paths-ignore:
      - 'backups/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      STORE_URL: ${{ vars.STORE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/clean-credentials

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Check credentials
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set — Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi
          # Everything below is optional: the account id lives in
          # app/wrangler.jsonc, and a deploy never removes a secret already on
          # the Worker.
          [ -n "${ADMIN_PASSWORD:-}" ] || echo "No ADMIN_PASSWORD — the password already stored on the Worker is kept."
          echo "Credentials present. Account: $(grep -o 'account_id\": \"[a-f0-9]*' wrangler.jsonc | cut -d'"' -f3)"

      - name: Deploy
        id: deploy
        run: |
          set -euo pipefail
          set +e
          npx wrangler deploy 2>&1 | tee /tmp/deploy.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            # Annotations are the part of the log that stays readable in the
            # Actions UI and through the API.
            tail -n 12 /tmp/deploy.log | sed 's/^/::error::wrangler: /'
            exit "$code"
          fi
          url=$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/deploy.log | tail -n 1 || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: ${url:-unknown}"

      # After the deploy, so that a password problem can never stop the shop
      # from being published. The Worker keeps its previous secret on failure.
      - name: Push the dashboard password
        if: env.ADMIN_PASSWORD_READY == '1'
        continue-on-error: true
        run: |
          set -euo pipefail
          set +e
          printf '%s' "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD 2>&1 | tee /tmp/secret.log
          code=${PIPESTATUS[1]}
          set -e
          if [ "$code" -ne 0 ]; then
            tail -n 8 /tmp/secret.log | sed 's/^/::error::secret put: /'
            exit "$code"
          fi
          echo "ADMIN_PASSWORD updated on the Worker."

      - name: Smoke test
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          target="${STORE_URL:-$DEPLOY_URL}"
          if [ -z "$target" ]; then
            echo "::warning::Deployed URL not detected — health check skipped. Set the STORE_URL variable to force it."
            exit 0
          fi
          echo "Checking $target/api/health"
          body=""
          for attempt in 1 2 3 4 5; do
            body=$(curl -fsS --max-time 10 "$target/api/health" || true)
            [ -n "$body" ] && break
            echo "Waiting for $target (attempt $attempt)…"
            sleep 4
          done
          echo "Health: $body"
          echo "$body" | grep -q '"ok":true' || { echo "::error::Worker did not answer /api/health"; exit 1; }
          echo "$body" | grep -q '"database":true' || echo "::warning::database is false — check the D1 binding in app/wrangler.jsonc"
          echo "$body" | grep -q '"dashboard":true' || echo "::warning::dashboard is false — no ADMIN_PASSWORD is stored on the Worker: add the secret (it will be pushed on the next deploy) or set it in the Cloudflare dashboard once"
