name: Clean credentials
description: >
  Check the Cloudflare credential before wrangler touches it. A token pasted
  from the dashboard often arrives with a trailing newline or a surrounding
  fragment of text, and wrangler then fails with the unhelpful
  `Headers.set: "***" is an invalid header value`. This action trims the value,
  extracts the token when it is embedded in longer text, knows both the legacy
  40-character format and the current cfut_/cfat_ scannable format, and says
  precisely what is wrong when it cannot use the value.

runs:
  using: composite
  steps:
    - name: Normalise CLOUDFLARE_API_TOKEN
      shell: bash
      run: |
        set -euo pipefail

        # 0 = usable, 1 = not a token, 2 = a Global API Key (cfk_)
        check_token() {
          local value="$1" body
          case "$value" in
            cfut_*|cfat_*)
              # 2026 scannable format: cfut_/cfat_ + 40 characters + 8-character
              # checksum, 53 in total. The checksum length is undocumented, so
              # anything from 40 characters after the prefix is accepted.
              body="${value#*_}"
              [ "${#body}" -ge 40 ] || return 1
              case "$body" in
                *[!A-Za-z0-9]*) return 1 ;;
              esac
              return 0
              ;;
            cfk_*)
              return 2
              ;;
          esac
          # Legacy format: exactly 40 characters of [A-Za-z0-9_-].
          [ "${#value}" -eq 40 ] || return 1
          case "$value" in
            *[!A-Za-z0-9_-]*) return 1 ;;
          esac
          return 0
        }

        raw=$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}")
        # Mask every line: GitHub masks literal strings, not whole blocks, and a
        # multi-line paste must not leave its second line in the log.
        while IFS= read -r line; do
          [ -n "$line" ] && echo "::add-mask::$line"
        done <<< "$raw"

        if [ -z "$(printf '%s' "$raw" | tr -d '[:space:]')" ]; then
          echo "::error::CLOUDFLARE_API_TOKEN is empty — Settings → Secrets and variables → Actions → New repository secret."
          exit 1
        fi

        token=""
        trimmed=$(printf '%s' "$raw" | tr -d '[:space:]')
        if check_token "$trimmed"; then
          token="$trimmed"
        else
          # Whatever was pasted carries something else: a newline in the middle,
          # an `export …=` line, a label, quotes, a second value. Collect the
          # token-shaped pieces and accept only an unambiguous single one.
          unique=()
          while IFS= read -r candidate; do
            [ -z "$candidate" ] && continue
            check_token "$candidate" || continue
            duplicate=0
            for seen in "${unique[@]+"${unique[@]}"}"; do
              [ "$seen" = "$candidate" ] && duplicate=1
            done
            [ "$duplicate" -eq 0 ] && unique+=("$candidate")
          done < <(printf '%s' "$raw" | grep -oE '(cfut_|cfat_)[A-Za-z0-9]{40,}|[A-Za-z0-9_-]{40}' || true)

          count=${#unique[@]}
          if [ "$count" -eq 1 ]; then
            token="${unique[0]}"
            echo "::add-mask::$token"
            echo "::warning::The stored secret is not a bare token (${#trimmed} characters). Extracted the ${#token}-character token from it — the deploy is fine, but the secret is worth cleaning up."
          else
            state=0
            check_token "$trimmed" || state=$?
            if [ "$state" -eq 2 ]; then
              echo "::error::CLOUDFLARE_API_TOKEN holds a Global API Key (cfk_), which wrangler cannot use as a token. Create a scoped token instead: My Profile → API Tokens → Create Token → Custom token, with Account → Workers Scripts → Edit and Account → D1 → Edit."
              exit 1
            fi
            hint=""
            case "$trimmed" in
              *://*) hint="It looks like a URL." ;;
              *[/\\\\]*) hint="It looks like a file path — a secret must contain the token itself, not the name of a file that holds it." ;;
            esac
            if [ "${#trimmed}" -le 24 ]; then
              preview="$trimmed"
            else
              preview="$(printf '%s' "$trimmed" | head -c 12)…$(printf '%s' "$trimmed" | tail -c 4)"
            fi
            echo "::error::CLOUDFLARE_API_TOKEN is not a Cloudflare API token: ${#trimmed} characters, ${count} token-shaped candidates.${hint:+ $hint} What is stored starts with \`${preview}\`. A token is either 40 characters of [A-Za-z0-9_-] (older tokens) or cfut_/cfat_ followed by 40 characters and a checksum, 53 in total (2026 tokens)."
            exit 1
          fi
        fi

        echo "::notice::CLOUDFLARE_API_TOKEN accepted (${#token} characters, $(case "$token" in cfut_*) echo user ;; cfat_*) echo account ;; *) echo legacy ;; esac) format)."
        printf 'CLOUDFLARE_API_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"

    - name: Normalise ADMIN_PASSWORD
      shell: bash
      run: |
        set -euo pipefail
        if [ -z "${ADMIN_PASSWORD:-}" ]; then
          echo "No ADMIN_PASSWORD secret — the password already stored on the Worker is kept."
          exit 0
        fi
        # Only line breaks are removed: a password may legitimately contain spaces.
        password=$(printf '%s' "$ADMIN_PASSWORD" | tr -d '\r\n')
        echo "::add-mask::$password"

        # This secret overwrites the live dashboard password, so a value that is
        # obviously not a password (a file path, a URL) must never be pushed: it
        # would lock the shop's owner out of their own dashboard.
        refuse=""
        [ "${#password}" -ge 8 ] || refuse="shorter than 8 characters"
        [ "${#password}" -le 128 ] || refuse="longer than 128 characters"
        case "$password" in
          */*|*\\*|*://*) refuse="it looks like a file path or a URL" ;;
        esac
        if [ -n "$refuse" ]; then
          echo "::warning::ADMIN_PASSWORD not used (${refuse}). The password already stored on the Worker is kept, and the dashboard keeps working. Store the password itself, not the name of a file that holds it."
          exit 0
        fi

        printf 'ADMIN_PASSWORD=%s\n' "$password" >> "$GITHUB_ENV"
        printf 'ADMIN_PASSWORD_READY=1\n' >> "$GITHUB_ENV"
